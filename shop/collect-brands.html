
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zbieranie producentów Saturn</title>
</head>
<body>
  <h2>Zbieranie producentów Saturn</h2>
  <p id="status">Gotowe do rozpoczęcia.</p>
  <button id="start">Pobierz producentów</button>
  <button id="download" disabled>Pobierz brands.json</button>
  <pre id="result"></pre>

  <script>
    const startButton = document.querySelector("#start");
    const downloadButton = document.querySelector("#download");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");

    let collectedBrands = [];

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      downloadButton.disabled = true;

      const brands = new Set();
      let page = 1;
      let finished = false;

      try {
        while (!finished) {
          status.textContent =
            "Pobieranie katalogu od strony " + page + "...";

          const response = await fetch(
            "/api/brands?page=" + page
          );

          const data = await response.json();

          if (!response.ok || !data.ok) {
            throw new Error(data.error || "Błąd pobierania");
          }

          for (const brand of data.brands || []) {
            brands.add(brand);
          }

          if (data.hasMore && data.nextPage > page) {
            page = data.nextPage;
          } else {
            finished = true;
          }

          await new Promise(resolve =>
            setTimeout(resolve, 500)
          );
        }

        collectedBrands = [...brands].sort((a, b) =>
          a.localeCompare(b, "pl")
        );

        result.textContent = collectedBrands.join("\n");

        status.textContent =
          "Gotowe! Znaleziono " +
          collectedBrands.length +
          " producentów.";

        downloadButton.disabled = false;
      } catch (error) {
        status.textContent = "Błąd: " + error.message;
        startButton.disabled = false;
      }
    });

    downloadButton.addEventListener("click", () => {
      const blob = new Blob(
        [JSON.stringify(collectedBrands, null, 2)],
        { type: "application/json" }
      );

      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "brands.json";
      link.click();
      URL.revokeObjectURL(link.href);
    });
  </script>
</body>
</html>
