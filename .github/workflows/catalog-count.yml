
name: Licznik produktów Saturn

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  count-products:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Policz produkty
        run: node scripts/count-products.mjs

      - name: Zapisz wynik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop/catalog-count.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja licznika produktów"
            git push
          fi
