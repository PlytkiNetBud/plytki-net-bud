name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PlytkiNetBudIntegrator integrator-app/app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlytkiNetBudIntegrator-Windows
          path: dist/PlytkiNetBudIntegrator.exe
